<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部网盘资源库</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="dist/style.css">
</head>
<body class="bg-primary text-gray-200 min-h-screen flex flex-col">

    <!-- 🛡️ 访问验证模态框 -->
    <div id="accessModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(6px);">
        <div style="background:#1e293b; border:1px solid #334155; border-radius:16px; padding:2rem; max-width:400px; width:calc(100% - 2rem); box-shadow:0 20px 60px rgba(0,0,0,0.5); animation:modalIn 0.3s ease;">
            <div style="font-size:1.25rem; font-weight:700; color:#f8fafc; text-align:center; margin-bottom:1.5rem;">🔒 请输入访问码继续</div>
            <a id="accessLink" href="#" target="_blank" rel="noopener noreferrer" style="display:flex; align-items:center; justify-content:center; width:100%; padding:0.75rem; background:#3b82f6; color:#fff; border-radius:10px; font-weight:700; text-decoration:none; margin-bottom:1.5rem; transition:background 0.2s;">
                <span style="margin-right:0.5rem;">👉</span> 点击获取 <span id="linkDate" style="margin-left:0.25rem;"></span> 访问码
            </a>
            <label for="accessCodeInput" style="display:block; font-size:0.875rem; color:#94a3b8; margin-bottom:0.5rem; font-weight:600;">请输入访问码：</label>
            <input id="accessCodeInput" type="text" placeholder="请输入访问码" maxlength="15" autocomplete="off" style="width:100%; padding:0.75rem 1rem; border:2px solid #334155; border-radius:10px; font-size:1rem; outline:none; background:#0f172a; color:#fff; box-sizing:border-box;" />
            <button id="verifyBtn" style="width:100%; padding:0.85rem; background:#22c55e; color:#fff; border:none; border-radius:10px; font-size:1.1rem; font-weight:700; cursor:pointer; margin-top:1rem;">✅ 验证访问码</button>
            <div id="errorText" style="color:#ef4444; font-size:0.875rem; text-align:center; margin-top:1rem; font-weight:600; display:none;"></div>
        </div>
    </div>
    <style>
        @keyframes modalIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #accessModal input:focus { border-color: #3b82f6 !important; }
        #accessModal input.input-error { border-color: #ef4444 !important; }
        #accessModal .error-msg.show { display: block !important; }
        #accessLink:hover { background: #2563eb; }
        #verifyBtn:hover { background: #16a34a; }
    </style>

    <!-- ✅ 顶栏：四行纵向布局（含分类导航） -->
    <header class="bg-secondary border-b border-gray-700 px-3 pt-3 pb-2 md:p-4 sticky top-0 z-50 shadow-lg flex flex-col gap-2">
        <!-- 第一行：标题居中 + 右侧胶囊按钮 -->
        <div class="flex items-center justify-between w-full">
            <div class="w-16 md:hidden"></div>
            <h1 id="site-title" class="text-lg md:text-xl font-bold text-white text-center flex-1">资源库</h1>
            <div class="flex gap-2 shrink-0">
                <a id="btn-announcement" href="#" target="_blank" 
                   class="px-2.5 py-0.5 rounded-full bg-gray-800 border border-gray-600 text-xs text-gray-300 hover:text-accent hover:border-accent transition whitespace-nowrap">
                    📢 必看
                </a>
                <a id="btn-message-board" href="#" target="_blank" 
                   class="px-2.5 py-0.5 rounded-full bg-gray-800 border border-gray-600 text-xs text-gray-300 hover:text-accent hover:border-accent transition whitespace-nowrap">
                    💬 留言
                </a>
            </div>
        </div>

        <!-- 第二行：搜索栏独占一行 -->
        <div class="w-full">
            <input type="text" id="search-input" placeholder="🔍 搜索资源名称..." 
                   class="w-full bg-gray-800 border border-gray-600 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-accent text-sm">
        </div>

        <!-- ✅ 第三行：双层分类导航（原独立 nav 移入此处） -->
        <div class="w-full">
            <div class="flex items-center gap-1.5 md:gap-2 overflow-x-auto no-scrollbar py-1.5" id="parent-category-bar">
                <button id="btn-reset-category" class="shrink-0 px-3 py-1.5 rounded-full text-xs md:text-sm font-medium text-accent hover:bg-gray-700 transition category-active whitespace-nowrap">📂 全部</button>
                <!-- JS 动态渲染父分类 -->
            </div>
            <div class="flex items-center gap-1.5 md:gap-2 overflow-x-auto no-scrollbar py-1.5 hidden" id="child-category-bar">
                <!-- JS 动态渲染子分类 -->
            </div>
        </div>

        <!-- 第四行：排序按钮靠左 + 结果数量靠右 -->
        <div class="flex items-center justify-between w-full pt-0.5">
            <div class="flex bg-gray-800 rounded-lg p-0.5">
                <button id="sort-date" class="px-3 py-1 rounded text-xs font-medium bg-accent text-white whitespace-nowrap transition">按时间</button>
                <button id="sort-pinyin" class="px-3 py-1 rounded text-xs font-medium text-gray-400 hover:text-white whitespace-nowrap transition">按名称</button>
            </div>
            <span class="text-xs text-gray-400">共 <span id="total-count" class="text-accent font-bold">0</span> 条</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 p-6 overflow-y-auto" id="main-content">
            <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8"></div>
            <div id="pagination" class="flex justify-center items-center gap-2 mt-8 mb-12"></div>

            <section class="mt-12 border-t border-gray-700 pt-8">
                <h3 class="text-lg font-bold mb-4 text-gray-300">📊 统计</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-secondary p-4 rounded-lg border border-gray-700">
                        <div class="text-gray-400 text-sm">今日访问</div>
                        <div id="stat-today-views" class="text-2xl font-bold text-white mt-1">加载中...</div>
                    </div>
                    <div class="bg-secondary p-4 rounded-lg border border-gray-700">
                        <div class="text-gray-400 text-sm">热度排行 Top 5</div>
                        <ul id="stat-top-resources" class="text-sm text-gray-300 mt-2 space-y-1">
                            <li class="text-gray-500">加载中...</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-secondary w-full max-w-lg rounded-xl shadow-2xl border border-gray-700 overflow-hidden transform transition-all">
            <div class="p-6 border-b border-gray-700 flex justify-between items-start">
                <h2 id="modal-title" class="text-xl font-bold text-white pr-4"></h2>
                <button id="modal-close" class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            <div class="p-6">
                <div id="modal-meta" class="flex flex-wrap gap-2 mb-4 text-xs"></div>
                <div id="modal-links" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="verify.js"></script>
</body>
</html>
