<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>内部网盘资源库</title>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <link rel="stylesheet" href="dist/style.css">
    <style>
        :root {
            --bg-base: #f1f5f9;
            --border-subtle: rgba(15, 23, 42, 0.08);
            --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --card-gradient: linear-gradient(135deg, #4338ca 0%, #6d28d9 50%, #7c3aed 100%);
        }
        body { background-color: var(--bg-base); }
        
        @keyframes modalIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        #accessModal input:focus { border-color: #7c3aed !important; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }
        #accessLink:hover { filter: brightness(1.05); }
        #verifyBtn:hover { filter: brightness(1.05); }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ✅ 日期分组标题 */
        .group-label {
            grid-column: 1 / -1;
            font-size: 0.8rem;
            font-weight: 700;
            color: #3730a3;
            background: #e0e7ff;
            border: 1px solid #c7d2fe;
            padding: 0.45rem 1rem;
            border-radius: 8px;
            margin: 0.5rem 0 0.25rem;
        }

        /* ✅ 分类激活态 */
        .category-active {
            background: var(--accent-gradient) !important;
            color: #fff !important;
            border-color: transparent !important;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3) !important;
        }

        /* ✅ 蓝紫渐变卡片 */
        .resource-card {
            background: var(--card-gradient);
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
            position: relative;
            overflow: hidden;
        }
        .resource-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
            pointer-events: none;
        }
        .resource-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.35);
            filter: brightness(1.08);
        }
        .resource-card h3 {
            color: #ffffff;
            font-weight: 700;
            font-size: 0.92rem;
            line-height: 1.45;
            text-shadow: 0 1px 3px rgba(0,0,0,0.15);
        }
        /* ✅ 彩色分类标签 */
        .card-tag {
            display: inline-block;
            font-size: 0.68rem;
            font-weight: 600;
            padding: 2px 9px;
            border-radius: 20px;
            letter-spacing: 0.02em;
        }
        .tag-blue   { background: rgba(96,165,250,0.25); color: #bfdbfe; border: 1px solid rgba(96,165,250,0.3); }
        .tag-green  { background: rgba(52,211,153,0.25); color: #a7f3d0; border: 1px solid rgba(52,211,153,0.3); }
        .tag-amber  { background: rgba(251,191,36,0.25); color: #fde68a; border: 1px solid rgba(251,191,36,0.3); }
        .tag-rose   { background: rgba(251,113,133,0.25); color: #fecdd3; border: 1px solid rgba(251,113,133,0.3); }
        .tag-cyan   { background: rgba(34,211,238,0.25); color: #a5f3fc; border: 1px solid rgba(34,211,238,0.3); }
        .tag-purple { background: rgba(192,132,252,0.25); color: #e9d5ff; border: 1px solid rgba(192,132,252,0.3); }

        /* ✅ 分页按钮 */
        .page-btn {
            padding: 0.45rem 0.9rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            border: 1px solid #cbd5e1;
            color: #334155;
            background: #fff;
            transition: all 0.15s ease;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .page-btn:hover:not(:disabled):not(.page-active) {
            background: #eef2ff;
            border-color: #818cf8;
            color: #4338ca;
        }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-active {
            background: var(--accent-gradient) !important;
            color: #fff !important;
            border-color: transparent !important;
            box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
        }

        /* ✅ 排序非激活态 */
        .sort-btn-inactive {
            color: #475569 !important;
            font-weight: 600 !important;
            background: transparent !important;
        }
        .sort-btn-inactive:hover {
            color: #1e293b !important;
            background: rgba(0,0,0,0.06) !important;
        }

        /* ✅ 搜索框增强 */
        #search-input {
            background: #ffffff !important;
            border: 2px solid #cbd5e1 !important;
            color: #0f172a !important;
            font-weight: 500 !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important;
        }
        #search-input:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2), 0 2px 8px rgba(0,0,0,0.04) !important;
        }
        #search-input::placeholder { color: #94a3b8 !important; }
    </style>
</head>
<body class="text-slate-600 min-h-screen flex flex-col selection:bg-indigo-100 selection:text-indigo-700">

    <!-- 🛡️ 访问验证模态框 -->
    <div id="accessModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(15,23,42,0.4); z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(12px);">
        <div style="background:#fff; border:1px solid var(--border-subtle); border-radius:20px; padding:2.5rem; max-width:400px; width:calc(100% - 2rem); box-shadow:0 25px 60px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.8); animation:modalIn 0.3s ease;">
            <div style="font-size:1.3rem; font-weight:700; color:#0f172a; text-align:center; margin-bottom:1.75rem; letter-spacing:-0.02em;">🔒 安全验证</div>
            <a id="accessLink" href="#" target="_blank" rel="noopener noreferrer" style="display:flex; align-items:center; justify-content:center; width:100%; padding:0.85rem; background:var(--accent-gradient); color:#fff; border-radius:12px; font-weight:600; text-decoration:none; margin-bottom:1.5rem; transition:all 0.2s; box-shadow:0 4px 15px rgba(79, 70, 229, 0.25);">
                <span style="margin-right:0.5rem;">👉</span> 点击获取 <span id="linkDate" style="margin-left:0.25rem;"></span> 访问码
            </a>
            <label for="accessCodeInput" style="display:block; font-size:0.8rem; color:#64748b; margin-bottom:0.5rem; font-weight:500; text-transform:uppercase; letter-spacing:0.05em;">ACCESS CODE</label>
            <input id="accessCodeInput" type="text" placeholder="请输入访问码" maxlength="15" autocomplete="off" style="width:100%; padding:0.85rem 1rem; border:1px solid #e2e8f0; border-radius:12px; font-size:1rem; outline:none; background:#f8fafc; color:#0f172a; box-sizing:border-box; transition:all 0.2s;" />
            <button id="verifyBtn" style="width:100%; padding:0.9rem; background:#10b981; color:#fff; border:none; border-radius:12px; font-size:1rem; font-weight:600; cursor:pointer; margin-top:1rem; transition:all 0.2s; box-shadow:0 4px 15px rgba(16, 185, 129, 0.2);">✅ 验证并进入</button>
            <div id="errorText" style="color:#e11d48; font-size:0.85rem; text-align:center; margin-top:1rem; font-weight:500; display:none;"></div>
        </div>
    </div>

    <!-- ✅ 顶栏 -->
    <header class="backdrop-blur-xl bg-white/90 border-b border-slate-200 px-4 pt-3 pb-2 md:p-4 sticky top-0 z-50 flex flex-col gap-2.5 shadow-sm">
        <div class="flex items-center justify-between w-full">
            <div class="w-16 md:hidden"></div>
            <h1 id="site-title" class="text-lg md:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-700 to-violet-600 text-center flex-1 tracking-tight">资源库</h1>
            <div class="flex gap-2 shrink-0">
                <a id="btn-announcement" href="#" target="_blank" 
                   class="px-3 py-1 rounded-full bg-indigo-50 border border-indigo-200 text-xs font-semibold text-indigo-700 hover:bg-indigo-100 transition-all whitespace-nowrap">
                    📢 必看
                </a>
                <a id="btn-message-board" href="#" target="_blank" 
                   class="px-3 py-1 rounded-full bg-violet-50 border border-violet-200 text-xs font-semibold text-violet-700 hover:bg-violet-100 transition-all whitespace-nowrap">
                    💬 留言
                </a>
            </div>
        </div>

        <div class="w-full">
            <input type="text" id="search-input" placeholder="🔍 搜索资源名称..." 
                   class="w-full rounded-xl px-4 py-2.5 focus:outline-none text-sm transition-all">
        </div>

        <div class="w-full">
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" id="parent-category-bar">
                <button id="btn-reset-category" class="shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold bg-white text-indigo-600 border border-indigo-200 hover:bg-indigo-50 transition category-active whitespace-nowrap shadow-sm">📂 全部</button>
            </div>
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1 hidden" id="child-category-bar"></div>
        </div>

        <div class="flex items-center justify-between w-full pt-0.5">
            <div class="flex bg-slate-200/80 rounded-lg p-0.5 border border-slate-300/60">
                <button id="sort-date" class="sort-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gradient-to-r from-indigo-500 to-violet-500 text-white shadow-sm whitespace-nowrap transition">按时间</button>
                <button id="sort-pinyin" class="sort-btn sort-btn-inactive px-3 py-1.5 rounded-md text-xs whitespace-nowrap transition">按名称</button>
            </div>
            <span class="text-xs text-slate-600 font-semibold">共 <span id="total-count" class="text-indigo-600 font-bold text-sm">0</span> 条</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 p-4 md:p-6 overflow-y-auto" id="main-content">
            <div id="card-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 mb-8"></div>
            <div id="pagination" class="flex justify-center items-center gap-2 mt-8 mb-12"></div>

            <section class="mt-12 border-t border-slate-200/60 pt-8">
                <h3 class="text-lg font-bold mb-4 text-slate-700 tracking-tight">📊 数据统计</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-200 transition">
                        <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">今日访问</div>
                        <div id="stat-today-views" class="text-3xl font-bold text-slate-800 mt-2 tracking-tight">加载中...</div>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm hover:shadow-md hover:border-indigo-200 transition md:col-span-2">
                        <div class="text-slate-500 text-xs font-bold uppercase tracking-wider">热度排行 TOP 5</div>
                        <ul id="stat-top-resources" class="text-sm text-slate-600 mt-3 space-y-2">
                            <li class="text-slate-400">加载中...</li>
                        </ul>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 详情弹窗 -->
    <div id="modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-md hidden z-[100] flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden transform transition-all">
            <div class="p-6 border-b border-slate-100 flex justify-between items-start bg-gradient-to-r from-indigo-50 to-violet-50">
                <h2 id="modal-title" class="text-xl font-bold text-slate-800 pr-4 tracking-tight"></h2>
                <button id="modal-close" class="text-slate-400 hover:text-indigo-600 text-2xl leading-none transition">&times;</button>
            </div>
            <div class="p-6">
                <div id="modal-meta" class="flex flex-wrap gap-2 mb-4 text-xs"></div>
                <div id="modal-links" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="verify.js"></script>
</body>
</html>
